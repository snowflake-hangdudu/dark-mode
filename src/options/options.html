<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="settingsTitle">深色模式设置</title>
    <link rel="stylesheet" href="../ui/tokens.css">
    <link rel="stylesheet" href="../ui/components.css">
    <link rel="stylesheet" href="../ui/ambient.css">
    <link rel="stylesheet" href="options.css">
  </head>
  <body class="btu-root">
    <main class="btu-app-shell btu-surface">
      <header class="btu-header btu-app-header">
        <img class="btu-brand-mark" src="../../icons/icon32.png" alt="">
        <div class="btu-header__copy">
          <span class="btu-header__title" data-i18n="settingsTitle">深色模式设置</span>
          <p class="btu-header__desc" data-i18n="settingsDesc">扩展偏好设置保存在本机。</p>
        </div>
      </header>
      <section class="btu-settings-body">
        <label class="btu-setting-row" for="language-select">
          <span class="btu-setting-copy"><strong data-i18n="language">语言</strong></span>
          <select id="language-select" class="btu-select" data-i18n-aria="language">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <div class="dm-theme-block">
          <div class="dm-theme-copy">
            <strong data-i18n="theme">主题</strong>
            <small data-i18n="themeHint">扩展界面和网页共用这一套主题，改一处两边一起变。</small>
          </div>
          <div id="theme-picker" class="dm-theme-grid" role="radiogroup" data-i18n-aria="theme" aria-label="主题"></div>
        </div>
        <p id="theme-status" class="btu-status btu-status-message hidden" data-tone="info" role="status" aria-live="polite"></p>

        <h2 class="btu-view-title" data-i18n="sitesTitle">网站列表</h2>
        <div class="dm-block">
          <div class="dm-inline">
            <input id="site-input" type="text" placeholder="example.com" data-i18n-aria="siteInputLabel" aria-label="网站域名">
            <button id="add-site" class="btu-btn btu-btn--secondary" type="button" data-i18n="addSite">添加</button>
          </div>
          <ul id="site-list" class="dm-sites"></ul>
          <p id="site-empty" class="dm-empty" data-i18n="sitesEmpty">还没有单独设置的网站。</p>
        </div>

        <h2 class="btu-view-title" data-i18n="backup">备份</h2>
        <div class="dm-block">
          <div class="dm-inline">
            <button id="export-settings" class="btu-btn btu-btn--secondary" type="button" data-i18n="exportSettings">导出设置</button>
            <button id="import-settings" class="btu-btn btu-btn--secondary" type="button" data-i18n="importSettings">导入设置</button>
            <input id="import-file" type="file" accept="application/json,.json" hidden>
          </div>
        </div>
        <p class="dm-feedback"><span data-i18n="feedbackLabel">反馈邮箱</span>：<a href="mailto:hangdudu0@agent.qq.com">hangdudu0@agent.qq.com</a></p>
        <p id="save-status" class="btu-status btu-status-message hidden" data-tone="info" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
